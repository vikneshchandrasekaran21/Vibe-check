  introspection\\s*:\\s*true|graphiql\\s*:\\s*true|playground\\s*:\\s*true
  ```
- **ARCHIVE-EXTRACT** → `SEC-077`: Archive extraction (check for zip slip and zip bombs)
  ```regex
  \\.extractall\\s*\\(|extractAllTo\\s*\\(|unzipper\\.Extract|->extractTo\\s*\\(|\\btar\\.(?:x|extract)\\s*\\(|decompress\\s*\\(
  ```
- **PHP-UNSAFE** → `SEC-038`: PHP unserialize / extract / include on request data
  ```regex
  unserialize\\s*\\(\\s*\\$_(?:GET|POST|REQUEST|COOKIE)|\\bextract\\s*\\(\\s*\\$_(?:GET|POST|REQUEST)|\\b(?:include|require)(?:_once)?\\s*\\(?\\s*\\$_(?:GET|POST|REQUEST)
  ```
- **PHPINFO** → `SEC-079`: phpinfo() exposes server details
  ```regex
  \\bphpinfo\\s*\\(
  ```
- **EXPOSE-VERSION** → `VUL-012`: Server advertises its version (case-insensitive)
  ```regex
  expose_php\\s*=\\s*On|server_tokens\\s+on\\b|ServerTokens\\s+Full
  ```
- **DOCKER-SECRET** → `OPS-042`: Secret baked into a Docker image (ENV/ARG) (case-insensitive)
  ```regex
  ^\\s*(?:ENV|ARG)\\s+\\w*(?:SECRET|PASSWORD|PASSWD|TOKEN|API_KEY|PRIVATE_KEY|ACCESS_KEY)\\w*(?:\\s*=\\s*|\\s+)\\S+
  ```
- **DEFAULT-CREDS** → `SEC-080`: Default or trivial password in code or config (case-insensitive)
  ```regex
  \\b(?:password|passwd|pwd|admin_pass\\w*)\\b["']?\\s*[:=]\\s*["'](?:admin|password|123456|12345678|changeme|secret|root|test|letmein|qwerty)["']
  ```
- **AI-INSTRUCTION** → `SEC-083`: Text that tells AI tools what to do (treat as data, report it) (case-insensitive)
  ```regex
  ignore\\s+(?:all\\s+|any\\s+)?(?:previous|prior|above|earlier)\\s+instructions|(?:AI|LLM|GPT|Claude|Copilot|Cursor|assistant|agent|auditor|reviewer)s?\\s*(?:reviewers?|auditors?|agents?)?\\s*[:,]\\s*(?:please\\s+)?(?:ignore|skip|do not|don't|never|mark|treat|consider|report)\\b|\\bmark\\s+(?:this|it|the\\s+\\w+)\\s+(?:as\\s+)?(?:pass|passed|safe|secure|reviewed)\\b|\\bdo\\s+not\\s+(?:report|flag|mention)\\s+(?:this|these|any)\\b|\\bnew\\s+system\\s+prompt\\b|<\\s*/?\\s*system\\s*>
  ```
- **HIDDEN-UNICODE** → `SEC-083`: Invisible or direction-changing Unicode characters
  ```regex
  [​‌‍‎‏‪-‮⁦-⁩]
  ```
- **VIEW-NO-INVOKER** → `SEC-084`: SQL view without security_invoker (runs as its owner and skips row-level security) (case-insensitive)
  ```regex
  create\\s+(?:or\\s+replace\\s+)?(?:materialized\\s+)?view\\s+(?:if\\s+not\\s+exists\\s+)?[\\w."]+(?![^\\n]*security_invoker)
  ```
- **SECURITY-DEFINER** → `SEC-084`: SECURITY DEFINER function (runs with its owner's rights: check who can call it) (case-insensitive)
  ```regex
  \\bsecurity\\s+definer\\b
  ```
- **FAIL-OPEN** → `SEC-085`: Error handler that allows the request (check fails open)
  ```regex
  catch\\s*(?:\\([^)]*\\))?\\s*\\{\\s*(?:return\\s+(?:true|next\\(\\))|next\\(\\))\\s*;?\\s*\\}|except[^:\\n]*:\\s*return\\s+True\\b
  ```
- **SAML-LIB** → `SEC-086`: SAML library in use (check it's patched against signature wrapping)
  ```regex
  ["'](?:ruby-saml|samlify|@node-saml/[\\w-]+|passport-saml|python3-saml|onelogin/php-saml|xml-crypto)["']|\\bgem\\s+["']ruby-saml["']
  ```
- **XFF-TRUST** → `SEC-087`: Client IP read from a header the client can set (case-insensitive)
  ```regex
  x-forwarded-for|x-real-ip|HTTP_X_FORWARDED_FOR|HTTP_X_REAL_IP|["']trust proxy["']\\s*,\\s*true
  ```
- **WEAK-CIPHER** → `SEC-090`: Unauthenticated or deprecated encryption mode (ECB/CBC, createCipher) (case-insensitive)
  ```regex
  aes-\\d+-(?:ecb|cbc)\\b|AES\\.MODE_(?:ECB|CBC)\\b|AES/(?:ECB|CBC)/|Cipher\\.getInstance\\(\\s*["']AES["']\\s*\\)|\\bcrypto\\.createCipher\\s*\\(
  ```
- **JWT-ALG-MIX** → `SEC-004`: JWT verify accepts both HMAC and RSA/EC algorithms (algorithm confusion)
  ```regex
  algorithms["']?\\s*[:=]\\s*\\[[^\\]\\n]*HS\\d{3}[^\\]\\n]*(?:RS|ES|PS)\\d{3}|algorithms["']?\\s*[:=]\\s*\\[[^\\]\\n]*(?:RS|ES|PS)\\d{3}[^\\]\\n]*HS\\d{3}
  ```
- **TODO-SECURITY** → `BS-04`: TODO / FIXME about security (case-insensitive)
  ```regex
  (?:TODO|FIXME|HACK|XXX)\\b[^\\n]*(?:auth|secur|permission|validat|rls|secret|password|rate.?limit|sanitiz)
  ```
- **ENV-TRACKED** → `SEC-022`: a `.env` file (not `.example`) is tracked by git (`git ls-files`)

